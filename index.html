<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hold The Road</title>
<style>
  :root { --bg: #0b0d10; --ink: #c8d7eb; --dim: rgba(200,215,235,0.45); --orange: #ff7a2a; --blue: #5aaaff; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; cursor: none; touch-action: none; }
  #menu {
    position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px;
    background: radial-gradient(ellipse at 50% 60%, rgba(30,36,44,0.55), rgba(5,6,8,0.92));
    font-family: ui-monospace, Menlo, Consolas, monospace; color: var(--ink); text-align: center;
    padding-inline: max(16px, env(safe-area-inset-left, 0px));
  }
  #menu h1 { margin: 0; font-weight: 400; font-size: clamp(28px, 6vw, 56px); letter-spacing: 0.3em; text-shadow: 0 0 18px rgba(255,122,42,0.7); color: #ffd2a8; }
  #menu p { margin: 0; color: var(--dim); font-size: 13px; letter-spacing: 0.15em; }
  #menu .levels { display: flex; flex-wrap: wrap; gap: 16px; justify-content: center; }
  #menu button {
    font: inherit; color: var(--ink); background: rgba(10,12,16,0.7); border: 1px solid rgba(200,215,235,0.18);
    padding: 16px 22px; min-width: 220px; cursor: pointer; letter-spacing: 0.12em; text-align: left;
  }
  #menu button small { display: block; margin-top: 6px; color: var(--dim); font-size: 11px; letter-spacing: 0.08em; }
  #menu button:hover, #menu button:focus-visible { border-color: var(--orange); box-shadow: 0 0 18px rgba(255,122,42,0.35); outline: none; }
  #menu button.l1:hover, #menu button.l1:focus-visible { border-color: var(--blue); box-shadow: 0 0 18px rgba(90,170,255,0.35); }
  #menu[hidden] { display: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="menu">
  <h1>HOLD THE ROAD</h1>
  <p>NIGHT CAMERA &nbsp;·&nbsp; ESC RETURNS HERE</p>
  <div class="levels">
    <button class="l1" id="go-bank">LEVEL 1 · CITY TRUST BANK<small>Sniper. Seven hostages, six gunmen.</small></button>
    <button id="go-road">PROTOTYPE · THE ROAD<small>They walk out of the fog and grab you.</small></button>
  </div>
</div>
<script src="engine.js"></script>
<script src="road.js"></script>
<script src="bank.js"></script>
<script>
  const menu = document.getElementById("menu"), canvas = document.getElementById("c");
  const LEVELS = { bank: BankLevel, road: RoadLevel };
  function play(name) {
    menu.hidden = true;
    try { history.replaceState(null, "", "#" + name); } catch (_) {}
    setLevel(LEVELS[name]);
  }
  document.getElementById("go-bank").onclick = () => play("bank");
  document.getElementById("go-road").onclick = () => play("road");
  addEventListener("keydown", ev => { if (ev.code === "Escape") menu.hidden = false; });
  startEngine(canvas, BankLevel);            // bank briefing runs behind the menu
  const h = location.hash.slice(1); if (LEVELS[h]) play(h);
</script>
</body>
</html>
